name: slack_registerabot
display_name: Slack (via RegisterABot)
description: Thin multi-tenant Slack adapter — receives Slack messages + files via Socket Mode and pipes them to a bot over the RegisterABot relay as a service client (using its OWN service key). The target bot slug comes from the profile that checks this interface. Posts the reply + uploads outbound files/audio/video back into the thread. No gatekeeper contact for messages.
type: interface
category: Interfaces
icon: slack
version: "0.2.0"
tenancy: multi_tenant
connection:
  pattern: http
  port: 8092
  container_name: slack-registerabot

# The adapter's OWN identity + platform creds (self-fetched from Infisical). NOT the bot slug —
# that is supplied per-profile via binding_fields below and delivered on /slugs/{bot}/connect.
credentials:
  - SLACK_BOT_TOKEN
  - SLACK_APP_TOKEN
  - REGISTERABOT_RELAY_URL
  - SLACK_REGISTERABOT_SERVICE_SLUG
  - SLACK_REGISTERABOT_TOKEN

# Per-profile binding: which bot this profile routes to (its registerabot slug). This is how
# the profile hands the adapter its bot slug — the adapter never owns it.
binding_fields:
  - name: bot_slug
    label: Bot Slug (registerabot)
    type: text
    required: true
