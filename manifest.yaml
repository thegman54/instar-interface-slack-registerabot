name: slack_registerabot
display_name: Slack (via RegisterABot)
description: Thin Slack adapter — receives Slack messages + files via Socket Mode, pipes them to the bot over the RegisterABot relay as a service client, and posts the bot's reply + uploads its outbound files/audio/video back into the thread. No gatekeeper contact.
type: interface
category: Interfaces
icon: slack
version: 0.1.0

credentials:
  - key: SLACK_BOT_TOKEN
    description: Slack bot token (xoxb-…) — receive events, download url_private files, and upload outbound files/audio/video (needs files:write scope)
  - key: SLACK_APP_TOKEN
    description: Slack app-level token (xapp-…) for Socket Mode
  - key: REGISTERABOT_RELAY_URL
    description: RegisterABot relay base URL (wss://…)
  - key: SLACK_REGISTERABOT_TOKEN
    description: This adapter's RegisterABot service API key (its relay identity)
  - key: SLACK_REGISTERABOT_BOT_SLUG
    description: Which bot to route to on the relay (e.g. seven) — who we send TO
  - key: SLACK_REGISTERABOT_SERVICE_SLUG
    description: This adapter's own service slug on the relay (who we speak AS; must match the service record the token belongs to; default slack-adapter)
